version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - echo "VITE_INVENTARIO_URL=https://tbs0b5snh4.execute-api.us-east-1.amazonaws.com" >> .env.production
        - echo "VITE_VENTAS_URL=https://tbs0b5snh4.execute-api.us-east-1.amazonaws.com" >> .env.production
        - echo "VITE_PROVEEDORES_URL=https://tbs0b5snh4.execute-api.us-east-1.amazonaws.com" >> .env.production
        - echo "VITE_PREDICCION_URL=https://tbs0b5snh4.execute-api.us-east-1.amazonaws.com" >> .env.production
        - echo "VITE_ALERTAS_URL=https://tbs0b5snh4.execute-api.us-east-1.amazonaws.com" >> .env.production
        - echo "VITE_ANALITICA_URL=https://tbs0b5snh4.execute-api.us-east-1.amazonaws.com" >> .env.production
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
