version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - echo "VITE_INVENTARIO_URL=$VITE_INVENTARIO_URL" >> .env.production
        - echo "VITE_VENTAS_URL=$VITE_VENTAS_URL" >> .env.production
        - echo "VITE_PROVEEDORES_URL=$VITE_PROVEEDORES_URL" >> .env.production
        - echo "VITE_PREDICCION_URL=$VITE_PREDICCION_URL" >> .env.production
        - echo "VITE_ALERTAS_URL=$VITE_ALERTAS_URL" >> .env.production
        - echo "VITE_ANALITICA_URL=$VITE_ANALITICA_URL" >> .env.production
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
